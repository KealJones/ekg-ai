name: CI

on:
  push:
    branches:
      - main
      - v0.3-preregistered-experiment
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript compiler
        run: npm install --no-save typescript@5
      - name: Run full test suite
        run: npm test
      - name: Run frozen v0 benchmark report
        run: npm run benchmark:report
